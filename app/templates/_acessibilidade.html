<!-- Barra de acessibilidade própria (sem custo, sem depender de widget de
     terceiros pago como o Hand Talk): fonte ajustável, alto contraste,
     fonte legível, espaçamento de texto, links destacados, escala de
     cinza, pausa de animações, cursor ampliado e guia de leitura — tudo
     num único menu, com preferências salvas por navegador (localStorage).
     O botão "Libras" aciona o VLibras já embutido na página (ver
     _vlibras.html), sem duplicar a tradução em Libras em si. -->
<div id="a11y-widget">
  <button
    type="button"
    id="a11y-abrir"
    aria-haspopup="dialog"
    aria-expanded="false"
    aria-controls="a11y-painel"
    aria-label="Abrir menu de acessibilidade"
  >
    <svg viewBox="0 0 20 20" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <circle cx="10" cy="10" r="8.5"/>
      <circle cx="10" cy="6.3" r="1.4" fill="currentColor" stroke="none"/>
      <path d="M10 8.3v4.5M6.2 9.8h7.6M8.2 17l1.8-4 1.8 4"/>
    </svg>
  </button>

  <div id="a11y-painel" class="a11y-painel" role="region" aria-label="Ferramentas de acessibilidade" hidden>
    <div class="a11y-painel-cabecalho">
      <h2>Acessibilidade</h2>
      <button type="button" id="a11y-fechar" aria-label="Fechar menu de acessibilidade">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 4l12 12M16 4 4 16"/></svg>
      </button>
    </div>

    <div class="a11y-grade">
      <button type="button" class="a11y-botao" data-acao="fonte-aumentar" aria-label="Aumentar tamanho da fonte">
        <span class="a11y-botao-icone" aria-hidden="true">A+</span>
        <span class="a11y-botao-texto">Aumentar fonte</span>
      </button>

      <button type="button" class="a11y-botao" data-acao="fonte-diminuir" aria-label="Diminuir tamanho da fonte">
        <span class="a11y-botao-icone" aria-hidden="true">A-</span>
        <span class="a11y-botao-texto">Diminuir fonte</span>
      </button>

      <button type="button" class="a11y-botao" data-acao="alto-contraste" aria-pressed="false">
        <span class="a11y-botao-icone" aria-hidden="true">
          <svg viewBox="0 0 20 20" width="20" height="20"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
        </span>
        <span class="a11y-botao-texto">Alto contraste</span>
      </button>

      <button type="button" class="a11y-botao" data-acao="fonte-legivel" aria-pressed="false">
        <span class="a11y-botao-icone a11y-botao-icone-texto" aria-hidden="true">Aa</span>
        <span class="a11y-botao-texto">Fonte legível</span>
      </button>

      <button type="button" class="a11y-botao" data-acao="espacamento" aria-pressed="false">
        <span class="a11y-botao-icone" aria-hidden="true">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4h14M3 10h14M3 16h14"/></svg>
        </span>
        <span class="a11y-botao-texto">Espaçar texto</span>
      </button>

      <button type="button" class="a11y-botao" data-acao="links" aria-pressed="false">
        <span class="a11y-botao-icone" aria-hidden="true">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8.5 12.5 12.5 8.5"/><path d="M9.5 6.5 11 5a3 3 0 0 1 4.2 4.2L13.7 10.7"/><path d="M10.5 13.5 9 15a3 3 0 0 1-4.2-4.2l1.5-1.5"/></svg>
        </span>
        <span class="a11y-botao-texto">Destacar links</span>
      </button>

      <button type="button" class="a11y-botao" data-acao="escala-cinza" aria-pressed="false">
        <span class="a11y-botao-icone" aria-hidden="true">
          <svg viewBox="0 0 20 20" width="20" height="20"><path d="M10 2.5c-3.6 3-3.6 3-3.6 7 0 2.3 1.6 4.2 3.6 5V2.5z" fill="currentColor"/><path d="M10 2.5c-3.6 3-3.6 3-3.6 7 0 2.3 1.6 4.2 3.6 5 2-.8 3.6-2.7 3.6-5 0-4 0-4-3.6-7z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </span>
        <span class="a11y-botao-texto">Escala de cinza</span>
      </button>

      <button type="button" class="a11y-botao" data-acao="sem-animacao" aria-pressed="false">
        <span class="a11y-botao-icone" aria-hidden="true">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="currentColor"><rect x="5.5" y="4" width="3" height="12" rx="1"/><rect x="11.5" y="4" width="3" height="12" rx="1"/></svg>
        </span>
        <span class="a11y-botao-texto">Pausar animações</span>
      </button>

      <button type="button" class="a11y-botao" data-acao="cursor-grande" aria-pressed="false">
        <span class="a11y-botao-icone" aria-hidden="true">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="currentColor"><path d="M4 2.5 15.5 10l-4.8 1.3L13 16l-2 1-2.3-4.7L4.8 15z"/></svg>
        </span>
        <span class="a11y-botao-texto">Cursor ampliado</span>
      </button>

      <button type="button" class="a11y-botao" data-acao="guia-leitura" aria-pressed="false">
        <span class="a11y-botao-icone" aria-hidden="true">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 5.5h15M2.5 14.5h15"/><rect x="2.5" y="8" width="15" height="4" rx="1" fill="currentColor" stroke="none" opacity="0.35"/></svg>
        </span>
        <span class="a11y-botao-texto">Guia de leitura</span>
      </button>

      <button type="button" class="a11y-botao" id="a11y-libras">
        <span class="a11y-botao-icone" aria-hidden="true">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 10.5V5a1.3 1.3 0 0 1 2.6 0v4"/><path d="M8.6 9V4a1.3 1.3 0 0 1 2.6 0v5"/><path d="M11.2 9.2V5a1.3 1.3 0 0 1 2.6 0v6.5"/><path d="M6 10.5c0 4 2 6.5 5.5 6.5s5.5-2.5 5.5-6V8a1.2 1.2 0 0 0-2.4 0"/></svg>
        </span>
        <span class="a11y-botao-texto">Libras</span>
      </button>

      <button type="button" class="a11y-botao a11y-botao-resetar" data-acao="resetar">
        <span class="a11y-botao-icone" aria-hidden="true">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M16 10a6 6 0 1 1-2-4.5"/><path d="M16 3v4h-4"/></svg>
        </span>
        <span class="a11y-botao-texto">Redefinir tudo</span>
      </button>
    </div>
  </div>
</div>

<div id="a11y-guia-leitura-barra" hidden aria-hidden="true"></div>
