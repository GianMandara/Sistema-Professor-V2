# Configuração de deploy para o Render (https://render.com) — "Infra as code".
# Basta conectar o repositório GitHub e o Render lê este arquivo automaticamente.
services:
  - type: web
    name: sistema-professor
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-professor-db
          property: connectionString
      # Só True em produção (o Render fornece HTTPS); em dev local por
      # http:// isso quebraria o cookie de sessão.
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_REMETENTE
        sync: false

databases:
  - name: sistema-professor-db
    plan: free
